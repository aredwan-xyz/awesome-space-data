name: Validate

on:
  pull_request:
  push:
    branches: [main]
    paths: ["resources.tsv", "build.py", "template.html", "README.md"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check resources.tsv builds
        run: python3 build.py --no-check

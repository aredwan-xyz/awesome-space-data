<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awesome Space Data</title>
<meta name="description" content="A link-checked, searchable index of open space data, tools, code and industry resources.">
<style>
  :root { --bg:#f6f5f1; --panel:#ffffff; --ink:#16181d; --muted:#626873; --line:#dedcd4; --accent:#1d4ed8; --chip:#ecebe5; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1014; --panel:#16191f; --ink:#eceef2; --muted:#9aa1ad; --line:#272b33; --accent:#8ab4ff; --chip:#20242c; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; } }
  * { box-sizing: border-box; }
  body { margin:0; overflow-x:hidden; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  header { padding:28px 16px 12px; max-width:1180px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:26px; letter-spacing:-0.01em; }
  header p { margin:0; color:var(--muted); }
  header .links { margin-top:8px; font-size:14px; }
  header .links a { color:var(--accent); text-decoration:none; }
  .bar { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); }
  .controls { max-width:1180px; margin:0 auto; padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input[type=search], select { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:0; }
  input[type=search] { flex:2 1 220px; }
  select { flex:1 1 160px; width:160px; max-width:100%; }
  label.tick { color:var(--muted); font-size:14px; display:flex; gap:6px; align-items:center; white-space:nowrap; }
  main { max-width:1180px; margin:0 auto; padding:12px 16px 60px; }
  .domains { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 10px; }
  .domains button { font:inherit; font-size:13px; cursor:pointer; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:4px 11px; }
  .domains button[aria-pressed=true] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .domains button span { color:var(--muted); margin-left:4px; }
  .domains button[aria-pressed=true] span { color:inherit; opacity:.7; }
  .count { color:var(--muted); margin:6px 0 12px; }
  h2.group { font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:22px 0 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(310px, 100%), 1fr)); gap:12px; }
  .card { min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .card h3 { margin:0; font-size:16px; line-height:1.3; }
  .card a { color:var(--accent); text-decoration:none; overflow-wrap:anywhere; }
  .card a:hover { text-decoration:underline; }
  .desc { color:var(--muted); font-size:14px; margin:0; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:var(--chip); border-radius:999px; padding:2px 9px; font-size:12px; color:var(--muted); }
  .yes { color:var(--ok); } .no { color:var(--bad); } .maybe { color:var(--warn); }
  .small { font-size:12px; color:var(--muted); margin:0; }
</style>
</head>
<body>
<header>
  <h1>Awesome Space Data</h1>
  <p>A link-checked index of open data, tools, code and industry resources for space projects. Links last checked {{CHECKED}}.</p>
  <p class="links"><a href="https://github.com/aredwan-xyz/awesome-space-data">GitHub</a> · <a href="resources.json">JSON</a> · <a href="resources.csv">CSV</a> · <a href="https://github.com/aredwan-xyz/awesome-space-data/blob/main/CONTRIBUTING.md">Add a resource</a></p>
</header>
<div class="bar"><div class="controls">
  <input id="q" type="search" placeholder="Search name, description or link" aria-label="Search">
  <select id="kind" aria-label="Kind"></select>
  <select id="access" aria-label="Access"></select>
  <label class="tick"><input id="live" type="checkbox"> Working links only</label>
</div></div>
<main>
  <div class="domains" id="domains"></div>
  <div class="count" id="count"></div>
  <div id="out"></div>
</main>
<script>
const DATA = /*DATA*/;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uniq = k => [...new Set(DATA.map(r => r[k]).filter(Boolean))];
let domain = '';
$('kind').innerHTML = '<option value="">All kinds</option>' + uniq('kind').sort().map(v => `<option>${esc(v)}</option>`).join('');
$('access').innerHTML = '<option value="">Any access</option>' + uniq('access').sort().map(v => `<option>${esc(v)}</option>`).join('');
const DOMAINS = uniq('domain');
function drawDomains() {
  $('domains').innerHTML = [['', 'All', DATA.length]].concat(DOMAINS.map(d => [d, d, DATA.filter(r => r.domain === d).length]))
    .map(([v, label, n]) => `<button type="button" data-d="${esc(v)}" aria-pressed="${v === domain}">${esc(label)}<span>${n}</span></button>`).join('');
}
$('domains').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; domain = b.dataset.d; drawDomains(); render(); });
function card(r) {
  const cls = r.link_ok === 'yes' ? 'yes' : (r.link_ok === 'no response' ? 'no' : 'maybe');
  const link = r.link_ok === 'yes' ? 'link works' : (r.link_ok === 'no response' ? 'link did not respond' : (r.link_ok === 'refused checker' ? 'link refused the checker' : 'link not checked'));
  return `<article class="card">
    <h3><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a></h3>
    <div class="chips">
      <span class="chip">${esc(r.kind)}</span>
      ${r.access ? `<span class="chip">${esc(r.access)}</span>` : ''}
            <span class="chip ${cls}">${link}</span>
    </div>
    <p class="desc">${esc(r.description)}</p>
    ${r.terms ? `<p class="small">Reuse: ${esc(r.terms)}</p>` : ''}
    <a class="small" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>
  </article>`;
}
function render() {
  const q = $('q').value.trim().toLowerCase(), kind = $('kind').value, access = $('access').value, live = $('live').checked;
  const rows = DATA.filter(r =>
    (!domain || r.domain === domain) && (!kind || r.kind === kind) && (!access || r.access === access) && (!live || r.link_ok === 'yes') &&
    (!q || (r.name + ' ' + r.description + ' ' + r.url + ' ' + r.domain + ' ' + r.terms + ' ' + r.kind).toLowerCase().includes(q)));
  $('count').textContent = `${rows.length} of ${DATA.length} resources`;
  $('out').innerHTML = DOMAINS.filter(d => rows.some(r => r.domain === d)).map(d =>
    `<h2 class="group">${esc(d)}</h2><div class="grid">${rows.filter(r => r.domain === d).map(card).join('')}</div>`).join('');
}
['q', 'kind', 'access', 'live'].forEach(id => $(id).addEventListener('input', render));
drawDomains(); render();
</script>
</body>
</html>
